<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="390" viewBox="0 0 1472 390"><title>DETR 自绘结构关系示意</title><desc>图像经CNN和编码器形成图像表示；可学习queries从独立支路进入解码器；解码器结合图像信息，经共享预测头并行输出类别和框。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#27446e" stroke-width="2"/></marker></defs><rect width="1472" height="390" rx="18" fill="#f7f9fc"/><g fill="none" stroke="#27446e" stroke-width="3" marker-end="url(#arrow)"><path d="M230 100H290"/><path d="M550 100H650"/><path d="M550 300H600V160H650"/><path d="M910 130H990"/><path d="M1200 130H1250"/></g><g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#21324a"><rect x="25" y="45" width="205" height="110" rx="18" fill="#e7edf5"/><text x="127" y="88" font-size="32">图像 → CNN</text><text x="127" y="130" font-size="28">提取空间特征</text><rect x="290" y="35" width="260" height="140" rx="18" fill="#e7edf5"/><text x="420" y="82" font-size="34">编码器</text><text x="420" y="124" font-size="28">特征 + 位置编码</text><text x="600" y="75" font-size="28">图像信息</text><rect x="290" y="245" width="260" height="105" rx="18" fill="#fff0e5"/><text x="420" y="288" font-size="32">object queries</text><text x="420" y="327" font-size="28">可学习的槽位身份</text><rect x="650" y="35" width="260" height="220" rx="18" fill="#e6f3ec"/><text x="780" y="88" font-size="34">解码器</text><text x="780" y="137" font-size="28">读取图像信息</text><text x="780" y="180" font-size="28">建模槽位间关系</text><text x="780" y="223" font-size="28">全部槽位并行处理</text><rect x="990" y="70" width="210" height="130" rx="18" fill="#e7edf5"/><text x="1095" y="122" font-size="32">共享预测头</text><text x="1095" y="165" font-size="28">逐槽位预测</text><rect x="1250" y="55" width="195" height="160" rx="18" fill="#e6f3ec"/><text x="1347" y="102" font-size="32">类别 + 框</text><text x="1347" y="147" font-size="28">类别可为 ∅</text><text x="1347" y="190" font-size="28">（无目标）</text><text x="1020" y="330" font-size="28">结构示意：两路输入在解码器结合</text></g></svg>