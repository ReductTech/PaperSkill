  I02:
    text: "theta_o and theta_n may map to separate task-head parameter collections."
    type: IMPLEMENTATION_MAPPING
    source: null
    boundary: "Specific tensor names and framework containers depend on an implementation."
  I03:
    text: "In an autograd implementation, backward computes gradients and an optimizer step applies updates to parameters included in its groups."
    type: IMPLEMENTATION_MAPPING
    source: null
