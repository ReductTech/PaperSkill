background:
  B01:
    text: "Softmax maps classification logits to normalized class probabilities; cross-entropy compares a probability output with a target distribution."
    type: GENERAL_BACKGROUND
    source: null
  B02:
    text: "Backpropagation computes derivatives; parameter mutation occurs when an optimizer applies an update."
    type: GENERAL_BACKGROUND
    source: null
  B03:
    text: "A shared backbone can feed multiple task-specific heads."
    type: GENERAL_BACKGROUND
    source: null

