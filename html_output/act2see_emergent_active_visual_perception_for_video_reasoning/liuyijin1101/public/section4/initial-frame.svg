<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">教学重绘：从火车车厢向外看</title>
  <desc id="desc">初始旅途画面能看到车厢和窗外站台的一部分，尚看不到问题所问的黑色电话亭。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a9bfd0"/>
      <stop offset="1" stop-color="#e5d0b2"/>
    </linearGradient>
    <linearGradient id="wall" x2="1" y2="1">
      <stop stop-color="#e5d5bc"/>
      <stop offset="1" stop-color="#ad936f"/>
    </linearGradient>
    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#b9d0d7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6f91a3" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="seat" x2="0" y2="1">
      <stop stop-color="#476678"/>
      <stop offset="1" stop-color="#263e4f"/>
    </linearGradient>
  </defs>

  <rect width="720" height="420" fill="#d8c6ab"/>
  <path d="M0 0h720v84H0z" fill="#cdbb9f"/>
  <path d="M0 0h720v25H0z" fill="#9c896e"/>
  <path d="M16 55h695v16H16z" fill="#f3e6d0" opacity=".65"/>

  <!-- The exterior is deliberately incomplete: the requested booth is outside this view. -->
  <path d="M98 91h440v234H98z" fill="url(#sky)"/>
  <path d="M98 206h440v15H98z" fill="#6d7a79"/>
  <path d="M98 221h440v104H98z" fill="#b9ae9b"/>
  <path d="M98 231h440v5H98z" fill="#e6d7b5"/>
  <path d="M112 223h392v14H112z" fill="#718291" opacity=".5"/>
  <path d="M98 264h440v3H98z" fill="#7e8982" opacity=".65"/>
  <path d="M98 287h440v2H98z" fill="#8b9892" opacity=".55"/>
  <path d="M154 150h70v57h-70zM333 151h79v56h-79z" fill="#78858a" opacity=".45"/>
  <path d="M158 151h60v8h-60zM337 152h70v8h-70z" fill="#d9dfd9" opacity=".55"/>
  <path d="M103 91h433v234H103z" fill="url(#glass)"/>

  <!-- Train window and interior frame. -->
  <path d="M83 76h469v263H83z" fill="none" stroke="#524b42" stroke-width="17"/>
  <path d="M91 80h451v253H91z" fill="none" stroke="#e8d7b9" stroke-width="7"/>
  <path d="M311 79v255" stroke="#716b5d" stroke-width="16"/>
  <path d="M311 79v255" stroke="#d9c8aa" stroke-width="5"/>
  <path d="M67 336h501v19H67z" fill="#6c6253"/>
  <path d="M58 352h531v11H58z" fill="#efe4d2"/>
  <path d="M0 84h77v263H0zM559 84h161v263H559z" fill="url(#wall)"/>
  <path d="M71 89h12v254H71zM552 89h15v254h-15z" fill="#715f4a"/>
  <path d="M0 346h720v74H0z" fill="#4c514c"/>
  <path d="M45 361h586v6H45z" fill="#c1ad87" opacity=".55"/>
  <path d="M255 372h244l41 48H195z" fill="#8c8172"/>
  <path d="M341 372h76l31 48H304z" fill="#b5a998" opacity=".7"/>

  <!-- Nearby seat signals the camera remains inside the train. -->
  <path d="M585 220q0-28 28-28h75q22 0 22 24v151H585z" fill="url(#seat)" stroke="#223a4a" stroke-width="5"/>
  <path d="M591 229q0-22 23-22h64q18 0 18 18v88H591z" fill="#608094" opacity=".55"/>
  <path d="M574 343h146v28H574z" fill="#284051"/>
  <path d="M584 371h15v49h-15zM689 371h15v49h-15z" fill="#293b46"/>
</svg>
