<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">教学重绘：傍晚火车停靠的站台</title>
  <desc id="desc">检索后补入的场景示意：黑色电话亭位于画面右侧，一处花卉陈列紧邻其正左侧。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#5b738c"/>
      <stop offset="1" stop-color="#b89a87"/>
    </linearGradient>
    <linearGradient id="platform" x2="0" y2="1">
      <stop stop-color="#b9b3a4"/>
      <stop offset="1" stop-color="#777e7b"/>
    </linearGradient>
    <linearGradient id="train" x2="1" y2="0">
      <stop stop-color="#d9d9d2"/>
      <stop offset="1" stop-color="#f5efe1"/>
    </linearGradient>
  </defs>

  <rect width="720" height="420" fill="url(#sky)"/>
  <path d="M0 179h720v32H0z" fill="#4b5660" opacity=".6"/>
  <path d="M0 205h720v215H0z" fill="url(#platform)"/>

  <!-- Station roof and lit canopy. -->
  <path d="M0 45h720v34H0z" fill="#384753"/>
  <path d="M0 79h720v13H0z" fill="#253742"/>
  <path d="M0 91h720v8H0z" fill="#a1a394"/>
  <path d="M35 99l106 83h27L91 99zM350 99l47 82h18l-34-82zM622 99l-20 82h18l35-82z" fill="#586673"/>
  <path d="M141 94h10v174h-10zM393 94h11v174h-11zM612 94h11v174h-11z" fill="#54616b"/>
  <path d="M173 105h84v5h-84zM473 105h85v5h-85z" fill="#f7d69b" opacity=".8"/>
  <circle cx="217" cy="110" r="7" fill="#f6ddb3" opacity=".55"/>
  <circle cx="512" cy="110" r="7" fill="#f6ddb3" opacity=".55"/>

  <!-- A stopped train on the left, with no invented signage or timing. -->
  <path d="M0 189h330q18 0 18 22v111H0z" fill="url(#train)" stroke="#60717b" stroke-width="4"/>
  <path d="M0 204h332v53H0z" fill="#536b7a"/>
  <path d="M21 214h55v35H21zM88 214h56v35H88zM157 214h56v35h-56zM226 214h59v35h-59z" fill="#b1c5c6"/>
  <path d="M20 262h313v8H20z" fill="#c88b64"/>
  <path d="M0 309h346v13H0z" fill="#68787b"/>
  <path d="M0 326h350v9H0z" fill="#495b61"/>
  <path d="M0 340h720v11H0z" fill="#d4bf87"/>

  <!-- The flower display sits immediately left of the phone booth. -->
  <path d="M392 284h89l-8 61h-73z" fill="#77624c" stroke="#5d5043" stroke-width="4"/>
  <path d="M396 303h80v10h-80z" fill="#9b7e5d"/>
  <path d="M403 270l12 35M420 268l4 36M441 265l-4 39M457 270l-12 35M468 279l-13 27" stroke="#55734e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="404" cy="266" r="10" fill="#e4a6a4"/>
  <circle cx="421" cy="264" r="11" fill="#eec5a2"/>
  <circle cx="440" cy="260" r="12" fill="#e5adbd"/>
  <circle cx="459" cy="265" r="10" fill="#f1ca9d"/>
  <circle cx="473" cy="276" r="9" fill="#d9a5ae"/>
  <circle cx="411" cy="278" r="6" fill="#f6e7cc"/>
  <circle cx="438" cy="275" r="6" fill="#f6e7cc"/>
  <circle cx="462" cy="282" r="5" fill="#f6e7cc"/>

  <!-- The booth is dark and visually distinct from the station architecture. -->
  <path d="M494 173h142v177H494z" fill="#202b32" stroke="#121d23" stroke-width="5"/>
  <path d="M504 185h122v24H504z" fill="#314049"/>
  <path d="M507 218h115v123H507z" fill="#395160" stroke="#171f25" stroke-width="4"/>
  <path d="M564 218v123" stroke="#1a252b" stroke-width="4"/>
  <path d="M519 232h33v58h-33zM577 232h30v58h-30z" fill="#b4c1bb" opacity=".35"/>
  <path d="M517 311h96v6h-96z" fill="#b4ada0" opacity=".4"/>
  <path d="M500 351h133v10H500z" fill="#252e30"/>
  <path d="M372 350h292" stroke="#717a73" stroke-width="4"/>
  <path d="M0 384h720" stroke="#67736e" stroke-width="4" opacity=".5"/>
</svg>
