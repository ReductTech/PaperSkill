<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="700" height="300" fill="white"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold">Performance Comparison</text>

  <!-- Table -->
  <rect x="50" y="50" width="600" height="200" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Header -->
  <rect x="50" y="50" width="600" height="30" fill="#E3F2FD" stroke="#E0E0E0" stroke-width="1"/>
  <text x="120" y="70" text-anchor="middle" font-size="12" font-weight="bold">Method</text>
  <text x="250" y="70" text-anchor="middle" font-size="12" font-weight="bold">Params</text>
  <text x="350" y="70" text-anchor="middle" font-size="12" font-weight="bold">GFLOPs</text>
  <text x="450" y="70" text-anchor="middle" font-size="12" font-weight="bold">mAP₅₀:₉₅</text>
  <text x="570" y="70" text-anchor="middle" font-size="12" font-weight="bold">CPU FPS</text>

  <!-- Row 1: Baseline -->
  <rect x="50" y="80" width="600" height="30" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="120" y="100" text-anchor="middle" font-size="11">YOLO26-n</text>
  <text x="250" y="100" text-anchor="middle" font-size="11">2.4M</text>
  <text x="350" y="100" text-anchor="middle" font-size="11">5.8</text>
  <text x="450" y="100" text-anchor="middle" font-size="11">49.9</text>
  <text x="570" y="100" text-anchor="middle" font-size="11">17</text>

  <!-- Row 2: +P3 BiViM -->
  <rect x="50" y="110" width="600" height="30" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="120" y="130" text-anchor="middle" font-size="11">+P3 BiViM</text>
  <text x="250" y="130" text-anchor="middle" font-size="11">2.45M (+2.1%)</text>
  <text x="350" y="130" text-anchor="middle" font-size="11">6.5 (+12.1%)</text>
  <text x="450" y="130" text-anchor="middle" font-size="11" fill="#F44336">48.4 (−1.5)</text>
  <text x="570" y="130" text-anchor="middle" font-size="11">—</text>

  <!-- Row 3: +P4 BiViM -->
  <rect x="50" y="140" width="600" height="30" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="120" y="160" text-anchor="middle" font-size="11">+P4 BiViM</text>
  <text x="250" y="160" text-anchor="middle" font-size="11">2.63M (+9.6%)</text>
  <text x="350" y="160" text-anchor="middle" font-size="11">6.2 (+6.9%)</text>
  <text x="450" y="160" text-anchor="middle" font-size="11" fill="#4CAF50">50.8 (+0.9)</text>
  <text x="570" y="160" text-anchor="middle" font-size="11">—</text>

  <!-- Row 4: +P5 BiViM -->
  <rect x="50" y="170" width="600" height="30" fill="white" stroke="#E0E0E0" stroke-width="1"/>
  <text x="120" y="190" text-anchor="middle" font-size="11">+P5 BiViM</text>
  <text x="250" y="190" text-anchor="middle" font-size="11">3.45M (+43.8%)</text>
  <text x="350" y="190" text-anchor="middle" font-size="11">6.1 (+5.2%)</text>
  <text x="450" y="190" text-anchor="middle" font-size="11" fill="#4CAF50">50.6 (+0.7)</text>
  <text x="570" y="190" text-anchor="middle" font-size="11">—</text>

  <!-- Row 5: MambaPSA (Highlighted) -->
  <rect x="50" y="200" width="600" height="35" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="120" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">MambaPSA</text>
  <text x="250" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">2.33M (−2.9%)</text>
  <text x="350" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">5.1 (−12.1%)</text>
  <text x="450" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">49.8 (−0.1)</text>
  <text x="570" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">20 (+17.6%)</text>

  <!-- Legend -->
  <rect x="50" y="260" width="600" height="30" fill="#F5F5F5"/>
  <text x="60" y="280" font-size="10" fill="#666">✓ Green = improvement, ✗ Red = degradation, ★ Bold = best efficiency-accuracy trade-off</text>
</svg>
