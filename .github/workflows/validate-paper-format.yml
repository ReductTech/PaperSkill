name: Validate paper format

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  paper-format:
    name: paper-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Test paper format validation
        run: node --test .github/scripts/validate-paper-format.test.js
      - name: Validate changed papers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/validate-paper-format.js "$BASE_SHA" "$GITHUB_SHA"
