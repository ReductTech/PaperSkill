# Install in ReductTech/PaperSkill/.github/workflows/notify-auto-merge.yml.
# App installation on coconut-yzp must include Auto_Merge before enabling.
name: Notify Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: notify-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token for the new merge controller
        id: dispatch-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_PRIVATE_KEY }}
          owner: coconut-yzp
          repositories: Auto_Merge
          permission-contents: write

      - name: Notify Auto_Merge
        env:
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          EVENT_TYPE: paperskill-pr-change
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/coconut-yzp/Auto_Merge/dispatches" \
            --data "{\"event_type\":\"${EVENT_TYPE}\",\"client_payload\":{\"source_repository\":\"${SOURCE_REPOSITORY}\"}}"
