name: Notify Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_run:
    workflows:
      - Validate paper tutorials
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: notify-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Select event type
        id: event
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "type=paperskill-check-complete" >> "$GITHUB_OUTPUT"
          else
            echo "type=paperskill-pr-change" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Auto_Merge
        env:
          DISPATCH_TOKEN: ${{ secrets.AUTO_MERGE_DISPATCH_TOKEN }}
          EVENT_TYPE: ${{ steps.event.outputs.type }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "AUTO_MERGE_DISPATCH_TOKEN is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/1223BETTYYANG/Auto_Merge/dispatches" \
            --data "{\"event_type\":\"${EVENT_TYPE}\",\"client_payload\":{\"source_repository\":\"${SOURCE_REPOSITORY}\"}}"
